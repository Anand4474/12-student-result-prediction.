global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/student_api_alerts.yml

scrape_configs:
  - job_name: "student-result-api"
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - "<render-service>.onrender.com"   # replace with your Render hostname (no https://)
